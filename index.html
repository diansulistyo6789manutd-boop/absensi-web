<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxnaHRuB3qer_gYfvlDWHzZDrrqafCVI2sU-_p6bQJ0Oos_O9YT-g0UxIp-iWfuZDdg/exec";

    let photoData = "";
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const gpsInput = document.getElementById("koordinat_gps");

    // 1. Jalankan Kamera & GPS
    window.addEventListener('DOMContentLoaded', () => {
      // Jalankan Kamera
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
          .then(stream => { video.srcObject = stream; })
          .catch(err => { alert("Kamera gagal diakses: " + err.message); });
      }

      // Jalankan GPS
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            gpsInput.value = pos.coords.latitude.toFixed(6) + ", " + pos.coords.longitude.toFixed(6);
          },
          () => { gpsInput.value = "GPS tidak diizinkan"; }
        );
      }
    });

    // 2. Ambil Foto
    function takeSnapshot() {
      const btnCam = document.getElementById('btnCapture');
      const context = canvas.getContext('2d');

      if (video.style.display !== "none") {
        // Tangkap foto dari video ke canvas
        canvas.width = video.videoWidth || 320;
        canvas.height = video.videoHeight || 240;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        photoData = canvas.toDataURL('image/jpeg', 0.7);

        video.style.display = "none";
        canvas.style.display = "block";
        btnCam.innerText = "Foto Ulang";
        btnCam.style.background = "#673AB7";
      } else {
        // Reset foto untuk jepret ulang
        photoData = "";
        video.style.display = "block";
        canvas.style.display = "none";
        btnCam.innerText = "Ambil Foto";
        btnCam.style.background = "#ff9800";
      }
    }

    // 3. Submit Form
    document.getElementById("attendanceForm").addEventListener("submit", function(e) {
      e.preventDefault();

      if (!photoData) {
        alert("Silakan ambil foto selfie terlebih dahulu!");
        return;
      }

      const btnSubmit = document.getElementById("btnSubmit");
      const alertBox = document.getElementById("alert");

      btnSubmit.disabled = true;
      btnSubmit.innerText = "Mengirim...";
      alertBox.style.display = "none";

      const payload = {
        karyawan_id: document.getElementById("karyawan_id").value,
        tipe_absen: document.getElementById("tipe_absen").value,
        gps: gpsInput.value,
        foto_base64: photoData
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alertBox.className = "alert-success";
        alertBox.innerText = "✅ Absensi & Selfie Berhasil Terkirim!";
        alertBox.style.display = "block";

        document.getElementById("attendanceForm").reset();
        takeSnapshot(); // Balikkan ke mode kamera
      })
      .catch((err) => {
        alertBox.className = "alert-error";
        alertBox.innerText = "❌ Gagal: " + err.message;
        alertBox.style.display = "block";
      })
      .finally(() => {
        btnSubmit.disabled = false;
        btnSubmit.innerText = "Kirim Absensi";
      });
    });
  </script>
